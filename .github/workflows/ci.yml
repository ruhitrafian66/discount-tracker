name: CI

on:
  push:
    branches: [main, netlify]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]   # 20 = what the server runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: for f in server.js lib/*.js public/app.js netlify/*.mjs netlify/functions/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Smoke test server
        run: |
          DISABLE_FETCH=1 DATA_DIR="$RUNNER_TEMP/data" PORT=3913 node server.js &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:3913/api/state && break; sleep 1; done
          curl -fsS http://127.0.0.1:3913/ | grep -q "Tilbud Tracker"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d x=1 http://127.0.0.1:3913/api/auth/login)" = 415
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3913/api/items)" = 401

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
